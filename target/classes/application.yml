server:
  port: 8082

spring:
  application:
    name: ms-account-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/banking_yanki}
      auto-index-creation: true
      uuid-representation: standard

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  security:
    # Bandera leída por SecurityConfig para activar permitAll() en desarrollo.
    # En producción debe ser false o no definirse (default false).
    dev-mode: ${SECURITY_DEV_MODE:true}
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

banking:
  events:
    enabled: true  # mientras no tengas Kafka en local
  account:
    minimum-opening-amount:
      standard: 0.00
      vip: 0.00
      pyme: 0.00
    savings:
      maintenance-fee-enabled: false
      maintenance-fee-amount: 0.00
      max-monthly-movements: 5
      extra-movement-fee: 2.00
    checking:
      maintenance-fee-enabled: true
      maintenance-fee-amount: 10.00
      max-monthly-movements: null
      extra-movement-fee: 0.00
    transactions:
      max-free-deposits: 5
      max-free-withdrawals: 5
      per-transaction-fee: 1.00
  card-service:
    base-url: ${CARD_SERVICE_URL:http://ms-card-service}
  transaction-service:
    base-url: ${TRANSACTION_SERVICE_URL:http://ms-transaction-service}

resilience4j:
  timelimiter:
    instances:
      transactionService:
        timeout-duration: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.banking.account: DEBUG